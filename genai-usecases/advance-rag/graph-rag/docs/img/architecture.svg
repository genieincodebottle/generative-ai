<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" role="img" aria-label="Graph RAG: three layers, one direction. UI calls the API over HTTP; the API calls the service layer.">
  <title>Graph RAG: three layers, one direction</title>
  <desc>Graph RAG: three layers, one direction. UI calls the API over HTTP; the API calls the service layer.</desc>
  <rect x="0" y="0" width="760" height="580" rx="10" fill="#f7f8fa"/>
  <style>
    .t  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1b2430; }
    .h  { font-size: 15px; font-weight: 600; }
    .s  { font-size: 12.5px; fill: #5b6675; }
    .m  { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; fill: #1b2430; }
    .ms { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.5px; fill: #5b6675; }
    .lbl{ font-size: 11.5px; fill: #5b6675; }
    .cap{ font-size: 12px; font-weight: 600; letter-spacing: .06em; }
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6675"/>
    </marker>
  </defs>

  <text class="t h" x="24" y="34">Graph RAG: three layers, one direction</text>
  <text class="t s" x="24" y="54">Vector search finds what looks similar; traversal reaches what it connects to.</text>

  <rect x="24" y="74" width="712" height="106" rx="8"
        fill="#e8f0fe" stroke="#4c7fd4" stroke-width="1.5"/>
  <text class="t cap" x="44" y="100" fill="#4c7fd4">UI</text>
  <text class="t m"   x="44" y="124">ui/app.py</text>
  <text class="t ms" x="44" y="152">retriever picker, routing explainer</text>
  <text class="t ms" x="44" y="170">requests only</text>

  <line x1="380" y1="180" x2="380" y2="228" stroke="#5b6675" stroke-width="1.6" marker-end="url(#arw)"/>
  <text class="t lbl" x="392" y="207">HTTP</text>
  <rect x="24" y="232" width="712" height="124" rx="8"
        fill="#e6f4ec" stroke="#3f9d6b" stroke-width="1.5"/>
  <text class="t cap" x="44" y="258" fill="#3f9d6b">ROUTING</text>
  <text class="t m"   x="44" y="282">api/main.py</text>
  <text class="t ms" x="44" y="310">GET</text>
  <text class="t ms" x="238" y="310">/health  /catalogue  /status</text>
  <text class="t ms" x="44" y="328">POST</text>
  <text class="t ms" x="238" y="328">/configure  /documents</text>
  <text class="t ms" x="44" y="346">POST</text>
  <text class="t ms" x="238" y="346">/query  /routing-explanation</text>

  <line x1="380" y1="356" x2="380" y2="404" stroke="#5b6675" stroke-width="1.6" marker-end="url(#arw)"/>
  <text class="t lbl" x="392" y="383">function calls</text>
  <rect x="24" y="408" width="712" height="144" rx="8"
        fill="#fdf0e3" stroke="#d98a34" stroke-width="1.5"/>
  <text class="t cap" x="44" y="434" fill="#d98a34">BUSINESS LOGIC</text>
  <text class="t m"   x="44" y="458">services/</text>
  <text class="t ms" x="44" y="486">graph_rag.py</text>
  <text class="t ms" x="238" y="486">edge detection, traversal + standard retrievers</text>
  <text class="t ms" x="44" y="504">agentic_router.py</text>
  <text class="t ms" x="238" y="504">LangGraph router: which retriever, and why</text>
  <text class="t ms" x="44" y="522">manager.py</text>
  <text class="t ms" x="238" y="522">one system, upload validation, key check</text>

  <text class="t lbl" x="44" y="544" font-style="italic">the API key is checked at point of use, so the module stays importable without one</text>

</svg>
