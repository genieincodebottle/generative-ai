<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" role="img" aria-label="Text-to-SQL: three layers, one direction. UI calls the API over HTTP; the API calls the service layer.">
  <title>Text-to-SQL: three layers, one direction</title>
  <desc>Text-to-SQL: three layers, one direction. UI calls the API over HTTP; the API calls the service layer.</desc>
  <rect x="0" y="0" width="760" height="580" rx="10" fill="#f7f8fa"/>
  <style>
    .t  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1b2430; }
    .h  { font-size: 15px; font-weight: 600; }
    .s  { font-size: 12.5px; fill: #5b6675; }
    .m  { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; fill: #1b2430; }
    .ms { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.5px; fill: #5b6675; }
    .lbl{ font-size: 11.5px; fill: #5b6675; }
    .cap{ font-size: 12px; font-weight: 600; letter-spacing: .06em; }
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6675"/>
    </marker>
  </defs>

  <text class="t h" x="24" y="34">Text-to-SQL: three layers, one direction</text>
  <text class="t s" x="24" y="54">Streamlit holds no SQL. The read-only gate sits in services/, not in the prompt.</text>

  <rect x="24" y="74" width="712" height="106" rx="8"
        fill="#e8f0fe" stroke="#4c7fd4" stroke-width="1.5"/>
  <text class="t cap" x="44" y="100" fill="#4c7fd4">UI</text>
  <text class="t m"   x="44" y="124">ui/app.py</text>
  <text class="t ms" x="44" y="152">widgets, tabs, CSV download</text>
  <text class="t ms" x="44" y="170">requests.get / requests.post only</text>

  <line x1="380" y1="180" x2="380" y2="228" stroke="#5b6675" stroke-width="1.6" marker-end="url(#arw)"/>
  <text class="t lbl" x="392" y="207">HTTP</text>
  <rect x="24" y="232" width="712" height="106" rx="8"
        fill="#e6f4ec" stroke="#3f9d6b" stroke-width="1.5"/>
  <text class="t cap" x="44" y="258" fill="#3f9d6b">ROUTING</text>
  <text class="t m"   x="44" y="282">api/main.py</text>
  <text class="t ms" x="44" y="310">GET</text>
  <text class="t ms" x="238" y="310">/providers  /database  /database/tables/{table}</text>
  <text class="t ms" x="44" y="328">POST</text>
  <text class="t ms" x="238" y="328">/query  ->  validate, map errors to status codes</text>

  <line x1="380" y1="338" x2="380" y2="386" stroke="#5b6675" stroke-width="1.6" marker-end="url(#arw)"/>
  <text class="t lbl" x="392" y="365">function calls</text>
  <rect x="24" y="390" width="712" height="162" rx="8"
        fill="#fdf0e3" stroke="#d98a34" stroke-width="1.5"/>
  <text class="t cap" x="44" y="416" fill="#d98a34">BUSINESS LOGIC</text>
  <text class="t m"   x="44" y="440">services/</text>
  <text class="t ms" x="44" y="468">sql_service.py</text>
  <text class="t ms" x="238" y="468">clean model output, THE READ-ONLY GATE</text>
  <text class="t ms" x="44" y="486">database.py</text>
  <text class="t ms" x="238" y="486">connect, inspect schema, execute</text>
  <text class="t ms" x="44" y="504">llm.py</text>
  <text class="t ms" x="238" y="504">provider -> chat model factory</text>
  <text class="t ms" x="44" y="522">config.py</text>
  <text class="t ms" x="238" y="522">the only file that names a model</text>

  <text class="t lbl" x="44" y="544" font-style="italic">imports neither Streamlit nor FastAPI - which is why 36 tests run with no API key</text>

</svg>
