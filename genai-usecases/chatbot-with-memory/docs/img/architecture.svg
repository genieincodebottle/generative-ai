<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 598" role="img" aria-label="PDF chat bot: three layers, one direction. UI calls the API over HTTP; the API calls the service layer.">
  <title>PDF chat bot: three layers, one direction</title>
  <desc>PDF chat bot: three layers, one direction. UI calls the API over HTTP; the API calls the service layer.</desc>
  <rect x="0" y="0" width="760" height="598" rx="10" fill="#f7f8fa"/>
  <style>
    .t  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1b2430; }
    .h  { font-size: 15px; font-weight: 600; }
    .s  { font-size: 12.5px; fill: #5b6675; }
    .m  { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; fill: #1b2430; }
    .ms { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.5px; fill: #5b6675; }
    .lbl{ font-size: 11.5px; fill: #5b6675; }
    .cap{ font-size: 12px; font-weight: 600; letter-spacing: .06em; }
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6675"/>
    </marker>
  </defs>

  <text class="t h" x="24" y="34">PDF chat bot: three layers, one direction</text>
  <text class="t s" x="24" y="54">Conversation memory belongs to the session, so rebuilding a chain cannot erase it.</text>

  <rect x="24" y="74" width="712" height="106" rx="8"
        fill="#e8f0fe" stroke="#4c7fd4" stroke-width="1.5"/>
  <text class="t cap" x="44" y="100" fill="#4c7fd4">UI</text>
  <text class="t m"   x="44" y="124">ui/app.py</text>
  <text class="t ms" x="44" y="152">chat widget, uploader, sidebar</text>
  <text class="t ms" x="44" y="170">multipart upload, then JSON per turn</text>

  <line x1="380" y1="180" x2="380" y2="228" stroke="#5b6675" stroke-width="1.6" marker-end="url(#arw)"/>
  <text class="t lbl" x="392" y="207">HTTP</text>
  <rect x="24" y="232" width="712" height="124" rx="8"
        fill="#e6f4ec" stroke="#3f9d6b" stroke-width="1.5"/>
  <text class="t cap" x="44" y="258" fill="#3f9d6b">ROUTING</text>
  <text class="t m"   x="44" y="282">api/main.py</text>
  <text class="t ms" x="44" y="310">POST /sessions</text>
  <text class="t ms" x="238" y="310">upload PDFs, index, open a session</text>
  <text class="t ms" x="44" y="328">POST /sessions/{id}/chat</text>
  <text class="t ms" x="238" y="328">ask within that session</text>
  <text class="t ms" x="44" y="346">DEL  /sessions/{id}/history</text>
  <text class="t ms" x="238" y="346">forget the talk, keep documents</text>

  <line x1="380" y1="356" x2="380" y2="404" stroke="#5b6675" stroke-width="1.6" marker-end="url(#arw)"/>
  <text class="t lbl" x="392" y="383">function calls</text>
  <rect x="24" y="408" width="712" height="162" rx="8"
        fill="#fdf0e3" stroke="#d98a34" stroke-width="1.5"/>
  <text class="t cap" x="44" y="434" fill="#d98a34">BUSINESS LOGIC</text>
  <text class="t m"   x="44" y="458">services/</text>
  <text class="t ms" x="44" y="486">session_store.py</text>
  <text class="t ms" x="238" y="486">LRU registry - WHERE MEMORY LIVES</text>
  <text class="t ms" x="44" y="504">rag_service.py</text>
  <text class="t ms" x="238" y="504">ingest, embed, the chain, the str coercion</text>
  <text class="t ms" x="44" y="522">retry.py</text>
  <text class="t ms" x="238" y="522">backoff for transient embedding failures</text>
  <text class="t ms" x="44" y="540">config.py</text>
  <text class="t ms" x="238" y="540">the only file that names a model</text>

  <text class="t lbl" x="44" y="562" font-style="italic">StrOutputParser returns a TextAccessor, not a str - coerced before retrieval</text>

</svg>
